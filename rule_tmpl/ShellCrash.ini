[custom]
; ShellCrash (sing-box 内核) 订阅转换模板
; 由 quantumult/quantumultx.conf 迁移而来，策略组名称、成员顺序与分流优先级与 QX 保持一致。
;
; 用法：ShellCrash → 在线订阅转换 → 自定义规则配置，填入本文件 raw 地址：
;   https://raw.githubusercontent.com/isudox/x-scripts/master/rule_tmpl/ShellCrash.ini
; 节点来源（QX 中的 nodes.snippet）改为在 ShellCrash 中填写订阅 / 分享链接；
; 订阅转换后端需同时支持 VLESS REALITY 与 sing-box 输出。
;
; 与 QX 的差异：
; - 不使用 GEOIP,CN 与 ChinaASN：sing-box 1.12+ 已移除 geoip 数据库，且不支持 IP-ASN，
;   改用 DustinWin cnip.list CIDR 列表。
; - 广告拦截使用 blackmatrix7 AdvertisingLite（约 3.8 万条）替代 Advertising（约 29 万条），
;   避免路由器内存不足。
; - QX 中 enabled=false 的规则（秋风广告、quantumult/rules/Brokerage.list）未迁移。
;
; 无法通过模板迁移、需另行处理的 QX 功能：
; - [rewrite_local] / [rewrite_remote] / [mitm] / [task_local]：sing-box 无 MITM 与脚本能力。
; - [dns]、dns_exclusion_list：在 ShellCrash 的 DNS 设置中配置。
; - excluded_routes：使用 ShellCrash 的「绕过局域网 / 常用端口」设置。
; - udp_drop_list (QUIC 屏蔽)：在 ShellCrash 中开启「禁用 QUIC」。

; ======= 本地例外（QX filter_local，优先级高于远程规则） ======= ;
ruleset=直连,[]DOMAIN,ad.12306.cn
ruleset=直连,[]DOMAIN,gg.caixin.com
ruleset=直连,[]DOMAIN,sdkapp.uve.weibo.com
ruleset=直连,[]DOMAIN-SUFFIX,ucweb.com
ruleset=拦截,[]DOMAIN,ntb.lanjie100.com
ruleset=直连,[]DOMAIN-SUFFIX,kuwo.cn

; ======= 局域网与保留地址 ======= ;
ruleset=直连,[]IP-CIDR,10.0.0.0/8
ruleset=直连,[]IP-CIDR,127.0.0.0/8
ruleset=直连,[]IP-CIDR,172.16.0.0/12
ruleset=直连,[]IP-CIDR,192.168.0.0/16
ruleset=直连,[]IP-CIDR,224.0.0.0/24
ruleset=直连,[]IP-CIDR,182.254.116.0/24

; ======= 规则修正（高优置顶防误杀） ======= ;
ruleset=直连,https://raw.githubusercontent.com/ddgksf2013/Filter/master/Unbreak.list,172800

; ======= 广告拦截与反劫持 ======= ;
ruleset=拦截,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/AdvertisingLite/AdvertisingLite.list,172800
ruleset=拦截,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Hijacking/Hijacking.list,172800

; ======= 垂直业务场景保护 ======= ;
ruleset=AI,quanx:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/quantumult-x/global.list,172800
ruleset=直连,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/WeChat/WeChat.list,172800
; PT 私有种子保护（直连防封号与跑流量）
ruleset=直连,quanx:https://cdn.jsdelivr.net/gh/isudox/x-scripts@master/quantumult/rules/privatetracker.list,172800
; 境外证券金融
ruleset=全球加速,https://raw.githubusercontent.com/forecho/broker-rules/main/rule/Shadowrocket/Broker.list,172800
ruleset=Crypto,https://raw.githubusercontent.com/iab0x00/ProxyRules/main/Rule/Crypto.txt,172800

; ======= 重点流媒体与 AI 服务 ======= ;
ruleset=Netflix,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Netflix/Netflix.list,172800
ruleset=全球加速,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/TikTok/TikTok.list,172800
ruleset=Spotify,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Spotify/Spotify.list,86400
ruleset=国际媒体,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/GlobalMedia/GlobalMedia.list,172800
ruleset=哔哩哔哩,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/BiliBili/BiliBili.list,172800
ruleset=Apple,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Apple/Apple.list,172800

; ======= 全球与国内路由 ======= ;
ruleset=全球加速,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Global/Global.list,172800
ruleset=直连,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/China/China.list,172800

; ======= 国内 IP（替代 geoip, cn） ======= ;
ruleset=直连,https://github.com/DustinWin/geoip/releases/download/ips/cnip.list,86400

ruleset=兜底分流,[]FINAL

; ======= 全局策略 ======= ;
custom_proxy_group=全球加速`select`[]AT`[]HK`[]TW`[]JP`[]SG`[]US`[]KR`[]节点列表`[]DIRECT
custom_proxy_group=手动指定`select`[]HK`[]TW`[]JP`[]SG`[]US`[]KR`[]全球加速`[]节点列表`[]DIRECT
custom_proxy_group=兜底分流`select`[]AT`[]全球加速`[]节点列表`[]DIRECT

; ======= 业务策略 ======= ;
custom_proxy_group=Apple`select`[]DIRECT`[]全球加速`[]节点列表
custom_proxy_group=Netflix`select`[]节点列表`[]国际媒体`[]全球加速`[]DIRECT
custom_proxy_group=AI`select`[]US`[]SG`[]JP`[]KR`[]手动指定`[]全球加速`[]节点列表`[]DIRECT
custom_proxy_group=Crypto`select`[]KR`[]US`[]SG`[]JP`[]手动指定`[]全球加速`[]节点列表`[]DIRECT
custom_proxy_group=哔哩哔哩`select`[]DIRECT`[]HK`[]TW
custom_proxy_group=国际媒体`select`[]AT`[]HK`[]TW`[]JP`[]SG`[]US`[]KR`[]节点列表`[]DIRECT
custom_proxy_group=Spotify`select`[]US`[]AT`[]DIRECT`[]TW`[]HK`[]JP`[]SG`[]节点列表

; ======= 内置策略映射（QX 的 proxy / direct / reject） ======= ;
custom_proxy_group=节点列表`select`.*
custom_proxy_group=直连`select`[]DIRECT
custom_proxy_group=拦截`select`[]REJECT

; ======= 区域延迟自动优选（1200s 周期，容差 50） ======= ;
custom_proxy_group=AT`url-test`^(?!.*(网易|墨鱼|剩余|到期|官网)).*$`http://www.gstatic.com/generate_204`1200,,50
custom_proxy_group=US`url-test`(?=.*(美|US|[Ss]tates|American))^((?!(港|台|日|韩|新)).)*$`http://www.gstatic.com/generate_204`1200,,50
custom_proxy_group=HK`url-test`(?=.*(港|HK|[Hh]ong))^((?!(台|日|韩|新|美)).)*$`http://www.gstatic.com/generate_204`1200,,50
custom_proxy_group=TW`url-test`(?=.*(台|TW|[Tt]aiwan))^((?!(港|日|韩|新|美)).)*$`http://www.gstatic.com/generate_204`1200,,50
custom_proxy_group=KR`url-test`(?=.*(韩|KR|[Kk]orea))^((?!(港|台|日|新|美)).)*$`http://www.gstatic.com/generate_204`1200,,50
custom_proxy_group=SG`url-test`(?=.*(新|狮|獅|SG|[Ss]ingapore))^((?!(港|台|日|韩|美)).)*$`http://www.gstatic.com/generate_204`1200,,50
custom_proxy_group=JP`url-test`(?=.*(日|JP|[Jj]apan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`1200,,50

enable_rule_generator=true
overwrite_original_rules=true
