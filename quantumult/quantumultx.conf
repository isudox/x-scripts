# Sample QuantumultX Configuration (Optimized v1.1.0)
# conf_url: https://github.com/isudox/x-scripts/raw/master/quantumultx.conf


[general]
# > 用于设置图标显示
profile_img_url = https://cdn.jsdelivr.net/gh/isudox/x-scripts@master/assets/icons/apple.png
# > 网络测试链接
network_check_url = http://www.bing.com
# > 用于节点延迟测试
server_check_url = http://www.gstatic.com/generate_204
# > 服务器测试超时时间 (毫秒)
server_check_timeout = 3000
# > 用于Check节点IP地址(以下geo_location_checker任选一个即可)
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/IP_API.js
# > 功能强大的解析器，用于引用资源的转换
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
# > 下列路径将不经过QuanX的处理
excluded_routes = 192.168.0.0/16, 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
# > UDP 流量限制与 QUIC 协议屏蔽（防止绕过策略及广告拦截）
udp_whitelist = 1-442, 444-65535
udp_drop_list = 443, STUN, QUIC
# > 第一个filter为4g模式开启规则分流，第二个filter为其他wifi下开启规则分流，第三个wifi1修改成你路由器翻墙的wifi名开启直连模式，第四个wifi2为你公司或者其他有路由器翻墙的WiFi名走直连）
running_mode_trigger = filter, filter, iG0Tu_5G:all_direct, iG0Tu: all_direct
;ssid_suspended_list=iG0Tu_5G
# > dns_exclusion_list（包含主机联机、内网、NTP校时、银行与运营商一键登录）
dns_exclusion_list = *.lan, *.10099.com.cn, cable.auth.com, *.msftconnecttest.com, *.msftncsi.com, network-test.debian.org, detectportal.firefox.com, resolver1.opendns.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, *.qq.com, localhost.*.qq.com, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, auth.wosms.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, *?miwifi.com, pool.ntp.org, *.pool.ntp.org, ntp.*.com, time.*.com, ntp?.*.com, time?.*.com, time.*.gov, time.*.edu.cn, *.ntp.org.cn, time.*.apple.com, PDC._msDCS.*.*, DC._msDCS.*.*, GC._msDCS.*.*


[dns]
;prefer-doh3
;doh-server = https://223.5.5.5/dns-query, https://223.6.6.6/dns-query
no-ipv6
no-system
server = 223.5.5.5
server = 119.29.29.29
server = 114.114.114.114
server = /*.tencent.com/119.29.29.29
server = /*.weixin.com/119.29.29.29
server = /*.qq.com/119.29.29.29
# > App Store 下载加速 CDN 别名
alias = /iosapps.itunes.apple.com/iosapps.itunes.apple.com.download.ks-cdn.com


[policy]
# ======= 全局策略 ======= #
static = 全球加速, AT, HK, TW, JP, SG, US, KR, proxy, direct, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Global.png
static = 手动指定, HK, TW, JP, SG, US, KR, 全球加速, proxy, direct, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
static = 兜底分流, AT, 全球加速, proxy, direct, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png

# ======= 业务策略 ======= #
static = Apple, direct, 全球加速, proxy, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
static = Netflix, proxy, 国际媒体, 全球加速, direct, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Netflix.png
static = AI, US, SG, JP, KR, 手动指定, 全球加速, proxy, direct, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
static = Crypto, KR, US, SG, JP, 手动指定, 全球加速, proxy, direct, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Blackhole.png
static = 哔哩哔哩, direct, HK, TW, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/bilibili.png
static = 国际媒体, AT, HK, TW, JP, SG, US, KR, proxy, direct, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Streaming.png

# ======= 区域延迟自动优选 ======= #
# 测速周期优化为 1200s (20分钟) 并设置容差 tolerance=50，避免频繁跳节点发热耗电
url-latency-benchmark = AT, server-tag-regex=^(?!.*(?:网易|墨鱼|剩余|到期|官网)).*$, check-interval=1200, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
url-latency-benchmark = HK, server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$, check-interval=1200, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png
url-latency-benchmark = TW, server-tag-regex=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$, check-interval=1200, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/TW.png
url-latency-benchmark = JP, server-tag-regex=(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$, check-interval=1200, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/JP.png
url-latency-benchmark = KR, server-tag-regex=(?=.*(韩|KR|(?i)Korea))^((?!(港|台|日|新|美)).)*$, check-interval=1200, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/KR.png
url-latency-benchmark = SG, server-tag-regex=(?=.*(新|狮|獅|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$, check-interval=1200, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/SG.png
url-latency-benchmark = US, server-tag-regex=(?=.*(美|US|(?i)States|American))^((?!(港|台|日|韩|新)).)*$, check-interval=1200, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png


